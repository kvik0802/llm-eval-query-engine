name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q -p no:asyncio
  eval:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python fixtures/make_db.py
      - run: python -m eval.cli run --suite all --data-dir eval/datasets --out report.json
      - run: python -m eval.cli markdown --suite all --data-dir eval/datasets --out report.md
      - name: Check regression vs baseline
        run: |
          python - <<'EOF'
          import json, sys
          cur = json.load(open('report.json'))
          try:
              base = json.load(open('baseline.json'))
          except FileNotFoundError:
              print('No baseline; writing one')
              json.dump({'avg_score': cur['avg_score'], 'passed': cur['passed'], 'n': cur['n']}, open('baseline.json','w'), indent=2)
              sys.exit(0)
          drop = base['avg_score'] - cur['avg_score']
          print(f"baseline={base['avg_score']} current={cur['avg_score']} drop={drop}")
          if drop > 0.02:
              print('REGRESSION: score dropped more than 2%')
              sys.exit(1)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            report.json
            report.md
