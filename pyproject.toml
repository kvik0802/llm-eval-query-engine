[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-query-engine"
version = "0.1.0"
description = "Hybrid evaluation framework for LLM query pipelines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "typer>=0.12",
  "scikit-learn>=1.3",
  "openai>=1.0",
  "anthropic>=0.30",
  "google-genai>=0.5",
  "matplotlib>=3.8",
  "plotly>=5.0",
  "streamlit>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
leval = "eval.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["eval*"]

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
